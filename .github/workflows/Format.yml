name: format-check

on:
  push:
    branches:
      - 'main'
    tags: '*'
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - ".github/workflows/Format.yml"
  pull_request:
    paths:
      - "src/**"
      - "lib/**"
      - "test/**"
      - ".github/workflows/Format.yml"

jobs:
  runic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
